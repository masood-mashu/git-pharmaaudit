name: audit-trail-immutability-checker
version: 1.0.0
description: "Verifies sequential chronological continuity and immutability of audit trail entries"
input_schema:
  type: object
  properties:
    log_entries_json:
      type: string
      description: "JSON list of sequential audit entries with sequence_id"
  required:
    - log_entries_json
implementation:
  type: script
  path: audit_trail_immutability_checker.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
