spec_version: "0.1.0"
name: git-pharmaaudit
version: 1.0.0
description: "Autonomous FDA 21 CFR Part 11 Electronic Batch Record & Digital Signature Auditor"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - fda-21-cfr-part-11-compliance
  - alcoa-data-integrity

tools:
  - electronic-signature-verifier
  - audit-trail-immutability-checker
  - sop-version-controller

runtime:
  max_turns: 50
  timeout: 120

tags:
  - healthcare
  - fda-compliance
  - 21-cfr-part-11
  - pharma-manufacturing
  - passport-challenge

metadata:
  passport_id: "aps-pharmaaudit-01"
  passport_category: "Healthcare"
